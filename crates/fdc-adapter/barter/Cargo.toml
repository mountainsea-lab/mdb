[package]
name = "fdc-barter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
fdc-core = { path = "../../fdc-core" }
barter-data = { path = "/Volumes/wdata/opensource/mountainsea-lab/barter-rs/barter-data" }
barter-instrument = { path = "/Volumes/wdata/opensource/mountainsea-lab/barter-rs/barter-instrument" }
barter-integration = { path = "/Volumes/wdata/opensource/mountainsea-lab/barter-rs/barter-integration", features = ["error", "metric", "protocol", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
